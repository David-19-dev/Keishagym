name: opengym

services:
  # One-time: download the exercise photos into ./media/ex (skipped if already there).
  # ~80 MB, from github.com/yuhonas/free-exercise-db (Unlicense / public domain).
  media:
    image: alpine/git
    volumes:
      - ./media/ex:/out/ex
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$(ls -A /out/ex 2>/dev/null)" ]; then
          echo "↓ Downloading exercise photos (~80 MB, one time)…"
          git clone --depth 1 https://github.com/yuhonas/free-exercise-db /tmp/ds
          cp -r /tmp/ds/exercises/. /out/ex/
          echo "✓ Exercise photos ready ($(ls /out/ex | wc -l) exercises)."
        else
          echo "✓ Exercise photos already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework).
  # image: prebuilt (docker compose pull). build: from source (docker compose up --build).
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
      - COACH_CODEX_HOME=/codex
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP
      # ChatGPT/Codex refresh tokens are kept separate from app data and mounted only into the
      # API container. This directory is owned by the unprivileged Coach runtime.
      - ./data/codex:/codex

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./media/ex:/usr/share/nginx/html/ex:ro
      # 3D demo videos, when there are any (frontend/src/lib/exercise-videos.js)
      - ./media/vid:/usr/share/nginx/html/vid:ro
