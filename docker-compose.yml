name: keishagym

services:
  # One-time: download the exercise photos into ./media/ex (skipped if already there).
  # ~80 MB, from github.com/yuhonas/free-exercise-db (Unlicense / public domain).
  media:
    image: alpine/git
    volumes:
      - ./media/ex:/out/ex
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$(ls -A /out/ex 2>/dev/null)" ]; then
          echo "↓ Downloading exercise photos (~80 MB, one time)…"
          git clone --depth 1 https://github.com/yuhonas/free-exercise-db /tmp/ds
          cp -r /tmp/ds/exercises/. /out/ex/
          echo "✓ Exercise photos ready ($(ls /out/ex | wc -l) exercises)."
        else
          echo "✓ Exercise photos already present — skipping download."
        fi
    restart: "no"

  # Builds the React frontend (multi-stage) and serves it, together with the exercise photos
  # from the shared volume. Accounts, sync and the Coach live in Supabase, not here.
  web:
    image: ghcr.io/david-19-dev/keishagym-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./media/ex:/usr/share/nginx/html/ex:ro
      # 3D demo videos, when there are any (frontend/src/lib/exercise-videos.js)
      - ./media/vid:/usr/share/nginx/html/vid:ro
